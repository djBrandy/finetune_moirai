# Moirai-large Progressive Fine-Tuning Config
# To advance phases: increment training.phase (1→2→3→4)
# All model params auto-configured per phase — do not edit model section manually.

training:
  phase: 1              # 1=M5  2=M1  3=H1  4=D1
  epochs: 15             # ceiling, not a target — early_stopping_patience below will
                         # usually stop it sooner once val loss plateaus
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  cpu_threads: 4
  save_every_n_epochs: 10
  log_every_n_steps: 100
  early_stopping_patience: 5    # stop if val loss hasn't improved in 5 epochs (0 = disabled)

  # window_stride: 32           # step between training windows; if omitted, defaults to
                                 # this phase's patch_size. stride=1 (old default) builds a
                                 # window at every offset — huge redundancy, ~343k windows/epoch
                                 # for phase 1. Striding by patch_size cuts steps ~32x with
                                 # minimal signal loss since neighboring windows barely differ.

  checkpoint_every_n_steps: 50   # save weights/optimizer/resume-state every N steps,
                                 # not just at epoch end — an interruption now costs at
                                 # most ~50 steps of progress instead of a full epoch

  directional_every_n_steps: 10  # only run the 20x-sample directional forward pass every
                                 # N steps instead of every step (it's the expensive part
                                 # of hybrid_loss); other steps use pure distributional loss
  directional_num_samples: 8     # samples used for the directional penalty when it does run
                                 # (was hardcoded to 20 in finetune.py)

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

data:
  raw_dir: "C:/Users/dando/Desktop/XBRUSD_data_2014-2022"
  processed_dir: "data"
  timeframes: ["M5", "M1", "H1", "D1"]
  train_end: "2020-12-31"
  val_end:   "2022-12-31"

signal:
  # Calibrated to XBRUSD M5 log-return distribution
  # mean_abs_return and spread_cost derived from training data stats
  tanh_scale: 50.0        # calibrated: XBRUSD M5 mean abs log-return ~0.0002
  min_tradeable_return: 0.0003  # must exceed spread cost to be worth trading
  long_threshold:  0.25
  short_threshold: -0.25
  # conviction scaling for C# position sizing (0=min_lots, 1=max_lots)
  conviction_floor: 0.0
  conviction_ceil:  1.0

paths:
  checkpoints: "checkpoints"
  logs: "logs"
  base_model: "model_cache"
  resume_state: "checkpoints/resume_state.json"

# Phase definitions — do not edit
phases:
  1:
    primary_tf: "M5"
    context_length: 288
    prediction_length: 12
    patch_size: 32
    best_model: "checkpoints/phase1_best"
  2:
    primary_tf: "M1"
    context_length: 1440
    prediction_length: 60
    patch_size: 32
    best_model: "checkpoints/phase2_best"
  3:
    primary_tf: "H1"
    context_length: 120
    prediction_length: 5
    patch_size: 16
    best_model: "checkpoints/phase3_best"
  4:
    primary_tf: "D1"
    context_length: 256
    prediction_length: 5
    patch_size: 32
    best_model: "checkpoints/phase4_best"